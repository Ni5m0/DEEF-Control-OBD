name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Estrai lo zip
        run: unzip -o -q DEEF-Control-*.zip
      - name: Prova categoria POI
        run: sed -i 's/androidx.car.app.category.IOT/androidx.car.app.category.POI/' $(find . -name AndroidManifest.xml)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Trova il progetto
        id: p
        run: |
          d=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)")
          echo "dir=$d" >> "$GITHUB_OUTPUT"
      - name: Compila
        shell: bash
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --console=plain 2>&1 | grep -v -E "^\s+at |^\s*$" | head -80
      - uses: actions/upload-artifact@v4
        with:
          name: DEEF-Control-debug
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/*.apk
